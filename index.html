<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טופס עדות | הדרכת הורים | דקלה שלום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9f3f4;
    --card:#ffffff;
    --teal:#67AEB8;
    --teal-dark:#4d8f98;
    --ink:#191818;
    --white:#ffffff;
    --error:#b3261e;
    --radius:16px;
    --shadow: 0 8px 30px rgba(25,24,24,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Heebo', Arial, sans-serif;
    line-height:1.6;
    min-height:100vh;
    padding: 24px 12px 60px;
  }
  .app-shell{
    max-width: 720px;
    margin: 0 auto;
  }
  header.site-header{
    text-align:center;
    margin-bottom: 24px;
  }
  header.site-header img.logo{
    width: 92px;
    height: 92px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid var(--teal);
    margin-bottom: 10px;
    background: var(--white);
  }
  header.site-header h1{
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--ink);
    margin: 4px 0 2px;
  }
  header.site-header .subtitle{
    color: var(--teal-dark);
    font-weight:600;
    font-size: 0.95rem;
    margin-bottom: 14px;
  }
  .card{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 22px 30px;
  }
  .section{ margin-bottom: 30px; }
  .section:last-of-type{ margin-bottom: 0; }
  .section h2{
    font-size:1.1rem;
    color: var(--ink);
    border-inline-start: 6px solid var(--teal);
    padding-inline-start: 12px;
    margin: 0 0 18px;
  }
  .field{ margin-bottom: 18px; }
  .field label.field-label{
    display:block;
    font-weight:700;
    font-size:0.96rem;
    margin-bottom:7px;
    color: var(--ink);
  }
  input[type="text"], input[type="email"], input[type="tel"], textarea{
    width:100%;
    font-family:inherit;
    font-size:1rem;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1.5px solid #bfdadd;
    background: var(--bg);
    color: var(--ink);
  }
  textarea{ min-height: 90px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, .choice-card:focus-within{
    outline: 3px solid var(--teal-dark);
    outline-offset: 2px;
  }
  fieldset{ border:none; padding:0; margin:0; }
  fieldset legend{
    display:block;
    font-weight:700;
    font-size:0.96rem;
    margin-bottom:9px;
    padding:0;
    color: var(--ink);
  }
  .choices{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .choice-card{ position:relative; }
  .choice-card input{
    position:absolute;
    opacity:0;
    width:1px; height:1px;
  }
  .choice-card label{
    display:flex;
    align-items:center;
    gap:8px;
    min-height:44px;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--teal);
    color: var(--ink);
    font-size:0.95rem;
    cursor:pointer;
    background: var(--white);
    transition: background 0.15s, color 0.15s;
  }
  .choice-card input:checked + label{
    background: var(--teal);
    color: var(--white);
    border-color: var(--teal);
    font-weight:600;
  }
  .field.invalid input, .field.invalid textarea, .field.invalid .choices .choice-card label{ border-color: var(--error); }
  .error-msg{
    color: var(--error);
    font-size:0.85rem;
    font-weight:600;
    margin-top:6px;
    display:none;
  }
  .field.invalid .error-msg{ display:block; }
  .required-star{ color: var(--error); }
  button{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:700;
    border-radius: 999px;
    padding: 14px 32px;
    border:none;
    cursor:pointer;
    min-height:48px;
  }
  .btn-primary{
    background: var(--ink);
    color: var(--white);
    width:100%;
  }
  .btn-primary:hover{ background:#000; }
  .btn-primary:disabled{ opacity:0.6; cursor:progress; }
  #formStatus{
    margin-top: 14px;
    font-weight:600;
    font-size:0.92rem;
    text-align:center;
  }
  #formStatus.error{ color: var(--error); }
  .success-screen{
    display:none;
    text-align:center;
    padding: 40px 20px;
  }
  .success-screen.active{ display:block; }
  .success-screen .big-check{
    font-size:3rem;
    margin-bottom:10px;
  }
  .success-screen h2{ color: var(--ink); }
  .success-screen p{ color:#3a4a4a; white-space:pre-line; }
  footer.credit{
    text-align:center;
    font-size:0.78rem;
    color:#6d8688;
    margin-top: 22px;
  }
  @media (max-width:480px){
    .card{ padding:20px 16px 24px; }
    header.site-header h1{ font-size:1.25rem; }
  }
</style>
</head>

    <h1>דקלה שלום - הדרכת הורים</h1>
    <div class="subtitle">טופס עדות ומשוב</div>
  </header>

  <main class="card">
    <form id="intakeForm" novalidate>
      <div id="formFields"></div>

      <button type="submit" class="btn-primary" id="submitBtn">שליחה</button>
      <div id="formStatus" role="status" aria-live="polite"></div>
    </form>

    <div class="success-screen" id="successScreen" role="status" aria-live="polite">
      <div class="big-check">✓</div>
      <h2>תודה רבה!</h2>
      <p>ממש מעריכה את הזמן והכנות שלכם - זה עוזר לי המון, וגם לזוגות אחרים שמתלבטים אם להתחיל :)</p>
    </div>
  </main>

  <footer class="credit">הפרטים שתמלאו נשלחים ישירות לדקלה, ומשמשים בהתאם למה שסימנתם לגבי פרסום.</footer>
</div>

<script>
(function(){
  "use strict";

  // ===================== CONFIGURATION =====================
  var CONFIG = {
    WEB3FORMS_ACCESS_KEY: "c0f2b8af-803c-4712-b231-468a7211e12e",
    SUBJECT: "עדות חדשה מהדרכת הורים - "
  };
  // ===========================================================

  var SECTIONS = [
    {
      title: "פרטים",
      fields: [
        { id: "full_name", label: "שם מלא", type: "text", required: true },
        { id: "phone", label: "טלפון (רשות)", type: "tel" },
        { id: "display_name", label: "איך תרצו שהשם יופיע ליד העדות, אם נפרסם אותה?", type: "radio", required: true,
          options: ["שם מלא", "שם פרטי בלבד", "רק ראשי תיבות"] },
        { id: "can_publish", label: "אפשר לפרסם את מה שתכתבו כעדות באתר וברשתות החברתיות?", type: "radio", required: true,
          options: ["כן, אפשר לפרסם", "לא, זה רק עבורי כמשוב אישי"] }
      ]
    },
    {
      title: "העדות שלכם",
      fields: [
        { id: "reason", label: "מה הביא אתכם להתחיל הדרכת הורים? מה היה הקושי או התחושה לפני שהתחלתם", type: "textarea", required: true },
        { id: "change", label: "מה השתנה אצלכם בבית מאז ההדרכה? (בזוגיות, בהתמודדות עם הילד/ה, בתחושה הכללית)", type: "textarea", required: true },
        { id: "insight", label: "הייתה נקודה או תובנה ספציפית שממש \"פתחה לכם את הראש\"? מה היא הייתה", type: "textarea" },
        { id: "recommend", label: "מה הייתם אומרים לזוג שמתלבט אם ההדרכה שווה את זה", type: "textarea", required: true },
        { id: "experience", label: "איך הייתה החוויה איתי לאורך התהליך", type: "textarea" },
        { id: "additional_notes", label: "משהו נוסף שבא לכם להוסיף", type: "textarea" }
      ]
    }
  ];

  var fieldsContainer = document.getElementById("formFields");
  var submitBtn = document.getElementById("submitBtn");
  var formStatus = document.getElementById("formStatus");
  var form = document.getElementById("intakeForm");

  function el(tag, attrs, children){
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function(c){ if (c) node.appendChild(c); });
    return node;
  }

  function buildField(field){
    var wrap = el("div", { class: "field", "data-field-id": field.id });
    var labelText = field.label + (field.required ? " *" : "");

    if (field.type === "radio"){
      var fs = el("fieldset");
      fs.appendChild(el("legend", { text: labelText }));
      var choices = el("div", { class: "choices" });
      field.options.forEach(function(opt, i){
        var optId = field.id + "_" + i;
        var cInput = el("input", { type: "radio", id: optId, name: field.id, value: opt });
        choices.appendChild(el("div", { class: "choice-card" }, [
          cInput,
          el("label", { for: optId, text: opt })
        ]));
      });
      fs.appendChild(choices);
      fs.appendChild(el("div", { class: "error-msg", role: "alert", text: "אשמח שתבחרו אפשרות אחת" }));
      wrap.appendChild(fs);
      return wrap;
    }

    wrap.appendChild(el("label", { for: field.id, class: "field-label", text: labelText }));
    var input;
    if (field.type === "textarea"){
      input = el("textarea", { id: field.id, name: field.id });
    } else {
      input = el("input", { type: field.type, id: field.id, name: field.id });
    }
    if (field.required) input.setAttribute("aria-required", "true");
    wrap.appendChild(input);
    wrap.appendChild(el("div", { class: "error-msg", role: "alert", text: "השדה הזה חשוב לי - אשמח שתמלאו אותו" }));
    return wrap;
  }

  SECTIONS.forEach(function(section){
    var sectionEl = el("div", { class: "section" });
    sectionEl.appendChild(el("h2", { text: section.title }));
    section.fields.forEach(function(field){
      sectionEl.appendChild(buildField(field));
    });
    fieldsContainer.appendChild(sectionEl);
  });

  function validateForm(){
    var valid = true;
    var firstInvalid = null;
    SECTIONS.forEach(function(section){
      section.fields.forEach(function(field){
        if (!field.required) return;
        var wrap = document.querySelector('.field[data-field-id="' + field.id + '"]');
        var isValid;
        if (field.type === "radio"){
          isValid = !!document.querySelector('input[name="' + field.id + '"]:checked');
        } else {
          var input = document.getElementById(field.id);
          isValid = !!(input && input.value.trim());
        }
        if (!isValid){
          valid = false;
          wrap.classList.add("invalid");
          if (!firstInvalid) firstInvalid = wrap;
        } else {
          wrap.classList.remove("invalid");
        }
      });
    });
    if (firstInvalid) firstInvalid.scrollIntoView({ behavior: "smooth", block: "center" });
    return valid;
  }

  function collectAnswers(){
    var sections = [];
    SECTIONS.forEach(function(section){
      var items = [];
      section.fields.forEach(function(field){
        var value = "";
        if (field.type === "radio"){
          var checked = document.querySelector('input[name="' + field.id + '"]:checked');
          value = checked ? checked.value : "";
        } else {
          var input = document.getElementById(field.id);
          value = input ? input.value.trim() : "";
        }
        items.push({ label: field.label, value: value });
      });
      sections.push({ title: section.title, items: items });
    });
    return sections;
  }

  function buildReportText(sections){
    var now = new Date();
    var dateStr = now.toLocaleDateString("he-IL");
    var lines = [];
    lines.push("טופס עדות - הדרכת הורים");
    lines.push("דקלה שלום · נשלח בתאריך " + dateStr);
    lines.push("");
    sections.forEach(function(section){
      lines.push("=== " + section.title + " ===");
      section.items.forEach(function(item){
        lines.push(item.label + ":");
        lines.push(item.value ? item.value : "(לא צוין)");
        lines.push("");
      });
    });
    return lines.join("\n");
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    if (!validateForm()) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "שולח...";
    formStatus.className = "";
    formStatus.textContent = "שולח את הטופס...";

    var sections = collectAnswers();
    var fullName = document.getElementById("full_name").value.trim() || "ללא שם";
    var reportText = buildReportText(sections);

    var fd = new FormData();
    fd.append("access_key", CONFIG.WEB3FORMS_ACCESS_KEY);
    fd.append("subject", CONFIG.SUBJECT + fullName);
    fd.append("from_name", "טופס עדות - " + fullName);
    fd.append("message", reportText);

    fetch("https://api.web3forms.com/submit", { method: "POST", body: fd })
      .then(function(res){ return res.json(); })
      .then(function(result){
        if (result && result.success){
          form.style.display = "none";
          document.getElementById("successScreen").classList.add("active");
        } else {
          throw new Error((result && result.message) || "שגיאה לא ידועה");
        }
      }).catch(function(err){
        console.error(err);
        formStatus.className = "error";
        formStatus.textContent = "משהו השתבש בשליחה. אפשר לנסות שוב, ואם זה חוזר על עצמו אפשר לשלוח לי הודעה בוואטסאפ.";
        submitBtn.disabled = false;
        submitBtn.textContent = "שליחה";
      });
  });

})();
</script>
